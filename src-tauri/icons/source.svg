<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="mic" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="stand" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#888888"/>
      <stop offset="100%" stop-color="#666666"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>

  <!-- Subtle border -->
  <rect x="40" y="40" width="944" height="944" rx="190" fill="none" stroke="#4ade80" stroke-opacity="0.06" stroke-width="1.5"/>

  <!-- Soft glow behind mic -->
  <ellipse cx="512" cy="340" rx="110" ry="160" fill="#4ade80" opacity="0.05"/>

  <!-- Microphone capsule (green = voice) -->
  <rect x="432" y="170" width="160" height="280" rx="80" fill="url(#mic)"/>

  <!-- Mic grille lines -->
  <line x1="462" y1="265" x2="562" y2="265" stroke="#1a1a2e" stroke-width="3" stroke-linecap="round" opacity="0.15"/>
  <line x1="462" y1="295" x2="562" y2="295" stroke="#1a1a2e" stroke-width="3" stroke-linecap="round" opacity="0.15"/>
  <line x1="462" y1="325" x2="562" y2="325" stroke="#1a1a2e" stroke-width="3" stroke-linecap="round" opacity="0.15"/>
  <line x1="462" y1="355" x2="562" y2="355" stroke="#1a1a2e" stroke-width="3" stroke-linecap="round" opacity="0.15"/>

  <!-- Left angle bracket < (silver/grey = code) -->
  <path d="M 385 310 L 275 470 L 385 630"
        fill="none" stroke="url(#stand)" stroke-width="44"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right angle bracket > (silver/grey = code) -->
  <path d="M 639 310 L 749 470 L 639 630"
        fill="none" stroke="url(#stand)" stroke-width="44"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Microphone stem -->
  <line x1="512" y1="630" x2="512" y2="730"
        stroke="#707070" stroke-width="36" stroke-linecap="round"/>

  <!-- Microphone base -->
  <line x1="414" y1="730" x2="610" y2="730"
        stroke="#707070" stroke-width="36" stroke-linecap="round"/>
</svg>
